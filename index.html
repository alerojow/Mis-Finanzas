<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis Finanzas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mis Finanzas">
<meta name="theme-color" content="#F3F5F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)">
<script>/* Tema elegido en Ajustes (se aplica antes de pintar para que no parpadee). */try{var t=localStorage.getItem("misfinanzas.tema");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Mis Finanzas v2 · "Coach": cada cifra con su explicación; gráficos de ritmo, composición y comparativo. */
:root {
  --bg: #F3F5F9; --card: #FFFFFF; --ink: #0F172A; --muted: #4B5567; --line: #E2E7EE; --soft: #EDF1F7; --ctl: #7C8899;
  --pri: #1E3A8A; --pri-bg: #1E3A8A; --on-pri: #FFFFFF;
  --good: #047857; --goodbg: #E6F5EE; --on-good: #FFFFFF; --warn: #9A4D06; --warnbg: #FCF1DF; --bad: #B42318; --badbg: #FCE9E7;
  --infobg: #EAF0FC; --infoink: #1E3A8A;
  --fijo: #3657A6; --var: #C9821A; --deu: #A23B5E; --aho: #0E8A5F; --lib: #CBD3DF;
  --k1: #1E3A8A; --k2: #0E8A5F; --k3: #C9821A; --k4: #7C4DCC; --k5: #0E7C99; --k6: #B8336A;
  --navbg: rgba(255, 255, 255, .94);
  --shadow: 0 1px 2px rgba(15, 23, 42, .05), 0 10px 24px -18px rgba(15, 23, 42, .28);
  --font: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1220; --card: #141D2F; --ink: #E8EDF5; --muted: #A3B0C2; --line: #26324A; --soft: #1B2539; --ctl: #7D8AA0;
    --pri: #8AA8FF; --pri-bg: #2F54D6; --on-pri: #FFFFFF;
    --good: #4CD69A; --goodbg: rgba(76, 214, 154, .14); --on-good: #0B1220; --warn: #F2B24C; --warnbg: rgba(242, 178, 76, .15); --bad: #FF8A80; --badbg: rgba(255, 138, 128, .15);
    --infobg: #17244A; --infoink: #C9D7FF;
    --fijo: #7EA2FF; --var: #E8B04A; --deu: #E58AAE; --aho: #4CD69A; --lib: #3A4760;
    --k1: #7EA2FF; --k2: #4CD69A; --k3: #E8B04A; --k4: #B79BFF; --k5: #52D1E0; --k6: #E58AAE;
    --navbg: rgba(20, 29, 47, .92); --shadow: 0 10px 24px -18px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1220; --card: #141D2F; --ink: #E8EDF5; --muted: #A3B0C2; --line: #26324A; --soft: #1B2539; --ctl: #7D8AA0;
  --pri: #8AA8FF; --pri-bg: #2F54D6; --on-pri: #FFFFFF;
  --good: #4CD69A; --goodbg: rgba(76, 214, 154, .14); --on-good: #0B1220; --warn: #F2B24C; --warnbg: rgba(242, 178, 76, .15); --bad: #FF8A80; --badbg: rgba(255, 138, 128, .15);
  --infobg: #17244A; --infoink: #C9D7FF;
  --fijo: #7EA2FF; --var: #E8B04A; --deu: #E58AAE; --aho: #4CD69A; --lib: #3A4760;
  --k1: #7EA2FF; --k2: #4CD69A; --k3: #E8B04A; --k4: #B79BFF; --k5: #52D1E0; --k6: #E58AAE;
  --navbg: rgba(20, 29, 47, .92); --shadow: 0 10px 24px -18px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--pri); outline-offset: 2px; border-radius: 8px; }
.ic { width: 20px; height: 20px; flex: none; display: block; }
.num { font-variant-numeric: tabular-nums; }
#app { max-width: 560px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(108px + env(safe-area-inset-bottom)); }

/* ---------- encabezado ---------- */
.top { position: sticky; top: 0; z-index: 5; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px 10px 18px; }
.top .tt { min-width: 0; }
.top small { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top h1 { margin: 0; font-size: clamp(19px, 5.6vw, 24px); font-weight: 700; letter-spacing: -.02em; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .tr { display: flex; gap: 8px; align-items: center; flex: none; }
.ms { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
.ms button, .ib { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 13px; color: var(--ink); }
.ib { background: var(--card); border: 1px solid var(--line); }
.ms button:active, .ib:active { background: var(--soft); }
.ib.lbl { width: 58px; align-content: center; justify-items: center; gap: 2px; font-size: 10.5px; font-weight: 600; line-height: 1; color: var(--pri); }
.ib.lbl .ic { width: 18px; height: 18px; }
.wrap { padding: 2px 16px 8px; display: grid; gap: 14px; }
.month { display: grid; gap: 6px; padding: 0 2px; }
.month .row { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); font-weight: 500; }
.month .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.month .bar i { display: block; height: 100%; background: var(--pri); border-radius: 3px; }

/* ---------- tarjetas ---------- */
.card { background: var(--card); border-radius: 20px; padding: 16px; box-shadow: var(--shadow); }
.ch { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: -2px 0 10px; min-height: 28px; }
.ch h2 { margin: 0; font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.ch h2 .ic { width: 18px; height: 18px; color: var(--var); }
.info { width: 44px; height: 44px; margin: -10px -10px -10px 0; display: grid; place-items: center; color: var(--muted); border-radius: 12px; flex: none; }
.info[aria-expanded="true"] { color: var(--pri); }
.exp { margin-top: 12px; background: var(--infobg); color: var(--infoink); border-radius: 14px; padding: 12px 14px; font-size: 13.5px; line-height: 1.5; }
.note { font-size: 13px; color: var(--muted); margin: 10px 0 0; line-height: 1.45; }
.p { margin: 0; font-size: 14px; line-height: 1.5; }
.sum { font-weight: 700; font-variant-numeric: tabular-nums; }
.tag { font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.tag.warn, .st.warn, .vs.warn, .pi.warn { background: var(--warnbg); color: var(--warn); }
.tag.good, .st.good, .vs.good, .pi.good { background: var(--goodbg); color: var(--good); }
.st.bad, .tag.bad { background: var(--badbg); color: var(--bad); }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 16px; border-radius: 14px; font-weight: 600; font-size: 15px; }
.btn .ic { width: 18px; height: 18px; }
.btn.pri { background: var(--pri-bg); color: var(--on-pri); }
.btn.sec { background: var(--soft); color: var(--ink); }
.btn.ghost { color: var(--bad); }
.btn.wide { width: 100%; }
.btn.sm { min-height: 40px; padding: 0 14px; font-size: 14px; border-radius: 12px; }
.btn:active { opacity: .85; }
.msg { display: flex; gap: 10px; align-items: flex-start; margin: 12px 0 0; padding: 10px 12px; border-radius: 12px; font-size: 13.5px; line-height: 1.45; }
.msg.warn { background: var(--warnbg); color: var(--warn); }
.msg.good { background: var(--goodbg); color: var(--good); }
.msg.bad { background: var(--badbg); color: var(--bad); }
.msg .ic { width: 18px; height: 18px; margin-top: 1px; }
.banner { display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; align-items: center; background: var(--warnbg); color: var(--warn); border-radius: 16px; padding: 10px 10px 10px 14px; }
.banner b { display: block; font-size: 14px; }
.banner small { display: block; font-size: 12.5px; opacity: .9; }
.banner .btn { background: var(--card); color: var(--ink); }

/* ---------- cómo voy ---------- */
.hrow { display: grid; grid-template-columns: 88px 1fr; gap: 14px; align-items: center; }
.ring { position: relative; width: 88px; height: 88px; }
.ring svg { display: block; }
.ring .rt { fill: none; stroke: var(--soft); stroke-width: 8; }
.ring .rv { fill: none; stroke: currentColor; stroke-width: 8; stroke-linecap: round; transition: stroke-dasharray .5s ease; }
.ring span { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1; }
.ring b { font-size: 28px; font-weight: 700; color: var(--ink); letter-spacing: -.02em; }
.ring small { font-size: 11px; color: var(--muted); margin-top: 3px; }
.st { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 700; padding: 3px 10px 3px 8px; border-radius: 999px; }
.st .ic { width: 14px; height: 14px; stroke-width: 2.6; }
.lead { margin: 8px 0 0; font-size: 14.5px; line-height: 1.45; }
.mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; padding: 12px 0 0; border-top: 1px solid var(--line); }
.mini div { min-width: 0; }
.mini dt { font-size: 12px; color: var(--muted); }
.mini dd { margin: 2px 0 0; font-size: 14.5px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini small { display: flex; align-items: center; gap: 2px; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.mini small.good { color: var(--good); }
.mini small.bad { color: var(--bad); }
.mini small .ic { width: 12px; height: 12px; stroke-width: 2.6; }
.disc { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; margin-top: 6px; font-size: 13.5px; font-weight: 600; color: var(--pri); text-align: left; }
.disc .ic { width: 18px; height: 18px; }
.rot { margin-left: auto; transition: transform .2s; }
[aria-expanded="true"] > .rot { transform: rotate(180deg); }
.pill { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 10px; }
.pill li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; }
.pi { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; }
.pi .ic { width: 15px; height: 15px; stroke-width: 2.6; }
.pill b { font-size: 14px; display: block; }
.pill small { font-size: 12.5px; color: var(--muted); display: block; line-height: 1.35; }
.pv { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 14px; white-space: nowrap; }
.pv i { font-style: normal; color: var(--muted); font-weight: 500; font-size: 12px; }

/* ---------- ritmo de la tarjeta ---------- */
.kpi small { font-size: 13px; color: var(--muted); font-weight: 500; }
.kpi .big { font-size: 36px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .big span { font-size: 16px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.kpi p { margin: 4px 0 0; font-size: 13.5px; color: var(--muted); }
.burn { width: 100%; height: auto; display: block; overflow: visible; margin-top: 14px; }
.burn text { font-family: var(--font); font-size: 10px; fill: var(--muted); }
.burn .ax { stroke: var(--line); }
.burn .bud { stroke: var(--var); stroke-dasharray: 4 4; stroke-width: 1.4; }
.burn .bud-t { fill: var(--warn); font-weight: 600; }
.burn .ideal { stroke: var(--ctl); stroke-width: 1; stroke-dasharray: 2 3; }
.burn .act { fill: none; stroke: var(--pri); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
.burn .proj { stroke: var(--good); stroke-width: 2; stroke-dasharray: 5 4; }
.burn .proj.over { stroke: var(--bad); }
.burn .end { fill: var(--good); }
.burn .end.over { fill: var(--bad); }
.burn .today { fill: var(--pri); stroke: var(--card); stroke-width: 2; }
.burn .strong { fill: var(--ink); font-weight: 600; }
.k3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.k3 span { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--muted); }
.k3 span i { width: 10px; height: 3px; border-radius: 2px; flex: none; }
.k3 b { font-size: 14.5px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.k3 b.good { color: var(--good); }
.k3 b.bad { color: var(--bad); }

/* ---------- pagos del mes ---------- */
.pays { list-style: none; margin: 0; padding: 0; }
.pays li { display: grid; grid-template-columns: 44px 1fr auto 44px; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.pays li:first-child { border-top: 0; padding-top: 0; }
.date { width: 44px; height: 44px; border-radius: 12px; background: var(--soft); display: grid; place-content: center; text-align: center; line-height: 1; }
.date b { font-size: 17px; }
.date small { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-top: 2px; font-weight: 600; }
.date.soon { background: var(--warnbg); color: var(--warn); }
.date.soon small { color: var(--warn); }
.date.late { background: var(--badbg); color: var(--bad); }
.date.late small { color: var(--bad); }
.pm { min-width: 0; }
.pm b { display: block; font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pm small { display: block; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pa { font-weight: 600; font-variant-numeric: tabular-nums; font-size: 14.5px; white-space: nowrap; }
.chk { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; }
.chk::before { content: ""; grid-area: 1/1; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--ctl); transition: background .15s, border-color .15s; }
.chk .ic { grid-area: 1/1; width: 15px; height: 15px; stroke-width: 3; color: transparent; }
.chk[aria-pressed="true"]::before { background: var(--good); border-color: var(--good); }
.chk[aria-pressed="true"] .ic { color: var(--on-good); }
.pays li.done .pm b, .pays li.done .pa { color: var(--muted); }
.pays li.fal { grid-template-columns: 36px 1fr auto auto; }
.pays li.fal .pm small { white-space: normal; }

/* ---------- categorías ---------- */
.cats { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.crow { display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 6px 0; }
button.crow { border-radius: 12px; }
.cic { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); flex: none; }
.cic .ic { width: 18px; height: 18px; }
.cm { min-width: 0; display: grid; gap: 5px; }
.ct { display: flex; justify-content: space-between; gap: 8px; font-size: 14.5px; }
.ct b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ct span { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cb { position: relative; height: 6px; border-radius: 3px; background: var(--soft); }
.cb i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
.cb i.ov { left: auto; right: 0; border-radius: 0 3px 3px 0; background: repeating-linear-gradient(135deg, var(--bad) 0 3px, color-mix(in srgb, var(--bad) 45%, transparent) 3px 6px); }
.cb i.hatch { background: repeating-linear-gradient(135deg, var(--var) 0 4px, color-mix(in srgb, var(--var) 35%, transparent) 4px 8px); }
.cb em { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 1px; }
.cm small { font-size: 12.5px; color: var(--muted); }
.cm small.warn { color: var(--warn); }
.cm small.bad { color: var(--bad); }

/* ---------- ahorro ---------- */
.sav { display: grid; gap: 10px; }
.sbar { display: grid; grid-template-columns: 74px 1fr auto; align-items: center; gap: 10px; font-size: 13px; }
.sbar .track { height: 10px; border-radius: 5px; background: var(--soft); overflow: hidden; }
.sbar .track i { display: block; height: 100%; border-radius: 5px; }
.sbar b { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 84px; text-align: right; }

/* ---------- composición / comparativo / tendencia ---------- */
.don { display: grid; grid-template-columns: 120px 1fr; gap: 14px; align-items: center; }
.don svg { display: block; }
.don .c-t { font-size: 20px; font-weight: 700; fill: var(--ink); font-family: var(--font); }
.don .c-s { font-size: 10px; fill: var(--muted); font-family: var(--font); }
.lg { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; font-size: 13px; }
.lg li { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; }
.lg .k { width: 10px; height: 10px; border-radius: 3px; }
.lg b { font-variant-numeric: tabular-nums; font-weight: 600; }
.lg small { display: block; color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.tbl th { font-size: 11px; font-weight: 600; color: var(--muted); text-align: right; padding: 0 0 6px; text-transform: uppercase; letter-spacing: .06em; }
.tbl th:first-child { text-align: left; }
.tbl td { padding: 8px 0 8px 6px; border-top: 1px solid var(--line); text-align: right; white-space: nowrap; }
.tbl td:first-child { text-align: left; color: var(--muted); padding-left: 0; }
.tbl tr.tot td { font-weight: 700; color: var(--ink); }
.tbl .g { color: var(--good); font-weight: 600; }
.tbl .b { color: var(--bad); font-weight: 600; }
.trend { width: 100%; height: auto; display: block; }
.trend .tx { font-family: var(--font); font-size: 11px; fill: var(--muted); }
.trend .tx.cur { fill: var(--ink); font-weight: 700; }
.tlg { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }
.tlg span { display: inline-flex; align-items: center; gap: 6px; }
.tlg i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

/* ---------- regla 50/30/20 ---------- */
.r503 { position: relative; margin: 26px 0 12px; }
.r503 .bar { display: flex; height: 16px; border-radius: 8px; overflow: hidden; background: var(--soft); }
.r503 .bar i { height: 100%; }
.r503 .bar i + i { box-shadow: -2px 0 0 var(--card); }
.r503 em { position: absolute; top: -6px; bottom: -6px; width: 2px; margin-left: -1px; background: var(--ink); font-style: normal; }
.r503 em::after { content: attr(data-l); position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--muted); font-weight: 600; }
.rl { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.rl li { display: grid; grid-template-columns: 12px 1fr auto auto; gap: 10px; align-items: center; font-size: 14px; }
.rl .k { width: 12px; height: 12px; border-radius: 3px; }
.rl .k.hatch, .r503 .bar i.hatch { background: repeating-linear-gradient(135deg, var(--ctl) 0 3px, color-mix(in srgb, var(--ctl) 30%, transparent) 3px 6px); }
.rl small { display: block; font-size: 12px; color: var(--muted); }
.rl b { font-variant-numeric: tabular-nums; }
.vs { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }

/* ---------- movimientos ---------- */
.search { display: flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 14px; border-radius: 14px; background: var(--card); border: 1.5px solid var(--line); }
.search .ic { width: 18px; height: 18px; color: var(--muted); }
.search input { border: 0; outline: 0; background: transparent; width: 100%; min-width: 0; font-size: 16px; }
.search input::-webkit-search-cancel-button { display: none; }
.search:focus-within { border-color: var(--pri); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }

<script>
(function () {
"use strict";

/* ===================== catálogo (igual al Excel) ===================== */
const SINDET = "Compras tarjeta sin detallar";
const CATS = [
  ["Arriendo y vivienda", "Fijo"], ["Servicios básicos", "Fijo"], ["Telefonía e internet", "Fijo"],
  ["Gimnasio y deporte", "Fijo"], ["Suscripciones", "Fijo"],
  ["Supermercado", "Variable"], ["Carnes", "Variable"], ["Bencina y transporte", "Variable"],
  ["Salidas y restaurantes", "Variable"], ["Diversión y panoramas", "Variable"], ["Ropa y calzado", "Variable"],
  ["Salud", "Variable"], ["Educación", "Variable"], ["Regalos y otros", "Variable"], [SINDET, "Variable"],
  ["Bancos y créditos", "Deuda"], ["Ahorro e inversión", "Ahorro"],
  ["Sueldo", "Ingreso"], ["Ingresos extra", "Ingreso"], ["Otros ingresos", "Ingreso"]
].map(([n, c]) => ({ n, c, t: c === "Ingreso" ? "Ingreso" : c === "Ahorro" ? "Ahorro" : "Gasto" }));
const CAT = Object.fromEntries(CATS.map(x => [x.n, x]));
const CHIP_ORDER = {
  Gasto: ["Supermercado", "Carnes", "Bencina y transporte", "Salidas y restaurantes", "Diversión y panoramas", "Ropa y calzado",
          "Gimnasio y deporte", "Salud", "Servicios básicos", "Telefonía e internet", "Arriendo y vivienda", "Suscripciones",
          "Educación", "Regalos y otros", "Bancos y créditos"],

};
const TOP_N = 6;

const DEF = { metaAhorro: 200000, metas: {}, presupuesto: {} };
const CLSVAR = { Fijo: "--fijo", Variable: "--var", Deuda: "--deu", Ahorro: "--aho", Ingreso: "--good" };
const CAT_ICON = { "Arriendo y vivienda": "home", "Servicios básicos": "zap", "Telefonía e internet": "wifi", "Gimnasio y deporte": "dumbbell", "Suscripciones": "repeat",
  "Supermercado": "cart", "Carnes": "flame", "Bencina y transporte": "fuel", "Salidas y restaurantes": "fork", "Diversión y panoramas": "ticket", "Ropa y calzado": "shirt",
  "Salud": "heart", "Educación": "book", "Regalos y otros": "gift", [SINDET]: "card", "Bancos y créditos": "bank", "Ahorro e inversión": "trend",
  "Sueldo": "wallet", "Ingresos extra": "coins", "Otros ingresos": "coins" };
const SHORT = { "Bencina y transporte": "Bencina", "Telefonía e internet": "Telefonía", "Gimnasio y deporte": "Gimnasio", "Salidas y restaurantes": "Salidas",

  "Bancos y créditos": "Créditos", "Ahorro e inversión": "Ahorro", [SINDET]: "Sin detallar", "Ingresos extra": "Extra", "Otros ingresos": "Otros" };
const NEC = new Set(["Supermercado", "Carnes", "Bencina y transporte", "Salud", "Educación"]);

/* ===================== utilidades ===================== */
const $ = s => document.querySelector(s);
const fmtN = v => Math.round(Math.abs(v || 0)).toLocaleString("es-CL");
const money = v => (v < -0.5 ? "−" : "") + "$" + fmtN(v);
const pct = (v, d) => (isFinite(v) ? (v * 100).toLocaleString("es-CL", { maximumFractionDigits: d == null ? 1 : d, minimumFractionDigits: 0 }) + "%" : "—");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const digits = s => Number(String(s || "").replace(/\D/g, "")) || 0;
const fmtIn = n => (n ? Number(n).toLocaleString("es-CL") : "");
const pad = n => String(n).padStart(2, "0");
const keyOf = d => d.getFullYear() + "-" + pad(d.getMonth() + 1);
const isoDay = d => keyOf(d) + "-" + pad(d.getDate());
const addM = (k, n) => { const [y, m] = k.split("-").map(Number); const d = new Date(y, m - 1 + n, 1); return keyOf(d); };
const MN = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const WD = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];
const mesLargo = k => { const [y, m] = k.split("-").map(Number); return MN[m - 1] + " " + y; };
const mesNom = k => MN[Number(k.split("-")[1]) - 1];
const mesCorto = k => MN[Number(k.split("-")[1]) - 1].slice(0, 3);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const short = n => SHORT[n] || n;
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const slug = s => norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const diasMes = k => { const [y, m] = k.split("-").map(Number); return new Date(y, m, 0).getDate(); };
const hoyIso = () => isoDay(new Date());

      orderBy() { return q; }, limit() { return q; },
      get: async () => snap(),
      onSnapshot(next) { const run = () => next(snap()); listeners.add(run); setTimeout(run, 0); return () => listeners.delete(run); },
      doc: id => doc(path + "/" + (id || newId())),
      add: async d => { const id = newId(); col(path)[id] = JSON.parse(JSON.stringify(d)); persist(); return doc(path + "/" + id); }
    };
    return q;
  }
  function doc(p) {
    const parts = p.split("/"), id = parts.pop(), c = parts.join("/");
    return {
      id, path: p,
      get: async () => sd(id, col(c)[id]),
      set: async d => { col(c)[id] = JSON.parse(JSON.stringify(d)); persist(); },
      delete: async () => { delete col(c)[id]; persist(); },
      onSnapshot(next) { const run = () => next(sd(id, col(c)[id])); listeners.add(run); setTimeout(run, 0); return () => listeners.delete(run); }
    };

const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

function render() {
  const v = $("#view");
  const ae = document.activeElement;
  if (ae && v.contains(ae) && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) { S.pendingRender = true; return; }
  S.pendingRender = false;
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-current", b.dataset.tab === S.tab ? "page" : "false"));
  if (S.status === "loading") { v.innerHTML = loadingView(); return; }
  const banner = S.status === "nodb" ? `<div class="sysbanner">No hay conexión con tu base de datos.</div>` :
                 S.status === "err" ? `<div class="sysbanner">Se perdió la conexión con tus datos. Recarga la página para reintentar.</div>` : "";
  const fn = { resumen: viewResumen, movimientos: viewMovs, tarjeta: viewTarjeta, aprende: viewAprende, ajustes: viewAjustes }[S.tab] || viewResumen;
  v.innerHTML = banner + fn();

/* Guarda varios documentos de una vez (cuentas del mes, compras importadas). */

function burnSVG(c) {

  const line = pts.map(([d, v], i) => (i ? "L" : "M") + X(d).toFixed(1) + "," + Y(v).toFixed(1)).join(" ");

    <circle class="today" cx="${X(c.dia).toFixed(1)}" cy="${Y(c.gastado).toFixed(1)}" r="4.5"/>
    <text class="strong" x="${X(c.dia).toFixed(1)}" y="${(Y(c.gastado) - 10).toFixed(1)}" text-anchor="${c.dia > c.dias - 3 ? "end" : "middle"}">${c.cerrado ? money(c.gastado) : "Hoy"}</text>

function autoMeses(f) {
  const fk = (f.fecha || hoyIso()).slice(0, 7);
  if (f.tipo === "Gasto" && isCard(f.medio)) { const F = corteDe(f.medio), d = Number((f.fecha || "").slice(8, 10)) || 1; return { mesPago: addM(fk, F && d > F ? 2 : 1), consumo: fk }; }
  if (f.tipo === "Gasto" && clasDe(f.categoria) === "Fijo") return { mesPago: fk, consumo: addM(fk, -1) };
  return { mesPago: fk, consumo: f.tipo === "Ingreso" ? "" : fk };
}

function impacto(f) {
  const card = f.tipo === "Gasto" && isCard(f.medio);
  const o = { mesPago: f.mesPago, card, tipo: f.tipo, cat: f.categoria, ok: !!(f.monto && f.categoria) };
  if (!o.ok) return o;
  const g = Object.assign({}, f, { dividir: f.tipo === "Gasto" ? Number(f.dividir) || 1 : 1 });
  const D2 = { movs: S.movs.filter(x => x.id !== f.id).concat([g]), tcs: S.tcs };
  const r1 = resumen(f.mesPago), r2 = resumen(f.mesPago, D2);
  o.mi = mi(g); o.saldo2 = r2.saldo;
  if (f.tipo === "Gasto") { o.pres = pres(f.categoria, f.mesPago); o.cat2 = r2.cat[f.categoria] || 0; }
  if (card) { const cm = addM(f.mesPago, -1), c1 = ciclo(cm), c2 = ciclo(cm, D2); o.dia1 = c1.diaria; o.dia2 = c2.diaria; o.restantes = c2.restantes; o.presVar = c2.base; }
  if (f.tipo === "Ahorro") {
    o.s1 = salud(f.mesPago).score; o.s2 = salud(f.mesPago, D2).score; o.meta = r2.meta; o.aho2 = r2.aho;
    const obj = f.objetivo && objetivos().find(x => x.id === f.objetivo);
    if (obj) { o.obj = obj; o.objAp = todosMovs().filter(x => x.id !== f.id && x.objetivo === obj.id && tipoDe(x) === "Ahorro").reduce((a, x) => a + mi(x), 0) + o.mi; }
  }
  o.saldo1 = r1.saldo;
  return o;
}

/* Presupuesto sugerido: promedio por categoría de los últimos 3 meses (por fecha de compra); el mes en curso cuenta proyectado desde el día 10.
   Categorías variables: solo con 2 o más meses de datos, para no sugerir montos de un mes incompleto. */
function sugerencias() {
  const hoy = new Date(), now = keyOf(hoy), dHoy = hoy.getDate(), all = todosMovs(), out = {};
  CATS.forEach(c => {
    if (c.n === SINDET || c.t === "Ahorro") return;
    if (c.t === "Ingreso") {
      if (c.n !== "Sueldo") return;
      for (let k = 0; k <= 3; k++) { const m = addM(now, -k), s = all.filter(x => x.categoria === c.n && x.mesPago === m).reduce((a, x) => a + mi(x), 0); if (s) { out[c.n] = { v: Math.round(s), base: mesCorto(m) }; break; } }
      return;
    }
    const vals = [];
    for (let k = 3; k >= 1; k--) { const m = addM(now, -k), s = all.filter(x => x.categoria === c.n && (x.fecha || "").slice(0, 7) === m).reduce((a, x) => a + mi(x), 0); if (s) vals.push([m, s]); }
    if (dHoy >= 10) { const s = all.filter(x => x.categoria === c.n && (x.fecha || "").slice(0, 7) === now).reduce((a, x) => a + mi(x), 0); if (s) vals.push([now, s / dHoy * diasMes(now)]); }
    if (!vals.length || (c.c === "Variable" && vals.length < 2)) return;
    const avg = vals.reduce((a, v) => a + v[1], 0) / vals.length;
    out[c.n] = { v: Math.ceil(avg / 5000) * 5000, base: vals.map(v => mesCorto(v[0])).join("–") };
  });
  return out;
}

async function shareFile(name, text, type) {
  const blob = new Blob([text], { type });
  try {
    const file = new File([blob], name, { type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return true; }
  } catch (e) { if (e && e.name === "AbortError") return false; }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
  return true;
}

const KEEP_FOCUS = new Set(["tc-estado", "cfg-save", "tc-save", "bk-restore", "tg", "pay", "filtro"]);

    case "obj-del": delObjetivo(b.dataset.id); break;
    case "f-obj": f.objetivo = v; renderSheet(); break;
    case "sug": { const i = document.querySelector(`.bud-in[data-cat="${CSS.escape(b.dataset.cat)}"]`); if (i) { i.value = fmtIn(Number(v)); b.remove(); toast("Sugerido aplicado: toca Guardar para confirmar"); } break; }
    case "sug-all": { const SG = sugerencias(); let n = 0; document.querySelectorAll(".bud-in").forEach(i => { const sg = SG[i.dataset.cat]; if (sg && !digits(i.value)) { i.value = fmtIn(sg.v); n++; } }); toast(n ? `${n} montos completados: revisa y toca Guardar` : "No había categorías vacías con sugerencia"); break; }
    case "cfg-tc-save": saveTcCfg(); break;
    case "imp-open": S.form = { imp: true, step: "paste", card: b.dataset.card, text: "" }; renderImport(); showSheet(); setTimeout(() => { const t = $("#imp-txt"); if (t) t.focus(); }, 300); break;
    case "imp-parse": { const t = $("#imp-txt"); if (t) f.text = t.value; const p = parseBanco(f.text, S.mes);
      if (!p.rows.length) { toast("No reconocí compras: cada línea necesita fecha y monto."); break; }
      const cur = S.tcs.find(x => x.mesPago === S.mes && x.tarjeta === f.card);
      Object.assign(f, { rows: p.rows, total: p.total, useTotal: !!p.total && !(cur && Number(cur.facturado)), step: "review" }); renderImport(); $("#sheet").scrollTop = 0; break; }
    case "imp-toggle": { const r = f.rows[Number(b.dataset.i)]; if (r) { r.on = !r.on; renderImport(); } break; }
    case "imp-total": f.useTotal = !f.useTotal; renderImport(); break;
    case "imp-back": f.step = "paste"; renderImport(); break;
    case "imp-run": importar(); break;
    case "pdf-open": { const i = document.getElementById("pdf-in"); if (i) i.click(); break; }
    case "pdf-pass": { const i = $("#pdf-pass"), pw = i ? i.value : ""; if (!pw) { toast("Escribe la clave del PDF."); break; } if (f && f.bytes) procesarPdf(f.bytes, pw); break; }
    case "aho-add": { const r = resumen(S.mes); openSheet({ tipo: "Ahorro", monto: Math.max(0, r.meta - r.aho) }); break; }
    case "edit": { const x = S.movs.find(m => m.id === b.dataset.id); if (x) openSheet(Object.assign({}, x, { monto: Number(x.monto) || 0, dividir: Number(x.dividir) || 1, estado: x.estado || "Pagado", vence: x.vence || "" })); break; }
    case "sheet-close": closeSheet(); break;
    case "f-tipo": if (f.tipo !== v) { f.tipo = v; f.categoria = v === "Ingreso" ? "Sueldo" : v === "Ahorro" ? "Ahorro e inversión" : ""; f.medio = v === "Gasto" ? "TC Scotiabank" : "Transferencia"; f.dividir = 1; refreshAuto(); renderSheet(); } break;
    case "f-cat": f.categoria = v; refreshAuto(); renderSheet(); break;
    case "f-more": S.moreCats = true; renderSheet(); break;
    case "f-tpl": { const x = S.movs.find(m => m.id === b.dataset.id); if (x) { Object.assign(f, { tipo: "Gasto", categoria: x.categoria, concepto: x.concepto || "", monto: Number(x.monto) || 0, medio: x.medio || "Transferencia", dividir: Number(x.dividir) || 1 }); refreshAuto(); renderSheet(); } break; }
    case "f-medio": f.medio = v; refreshAuto(); renderSheet(); break;
    case "f-div": f.dividir = Number(v); renderSheet(); break;
    case "f-estado": f.estado = v; renderSheet(); break;
    case "f-mes-prev": f.mesPago = addM(f.mesPago, -1); f.mesManual = true; renderSheet(); break;
    case "f-mes-next": f.mesPago = addM(f.mesPago, 1); f.mesManual = true; renderSheet(); break;
    case "f-del": f.del = true; renderSheet(); break;
    case "f-del-no": f.del = false; renderSheet(); break;
    case "f-del-yes": deleteForm(); break;
    case "filtro": S.filtro = v; render(); break;
    case "tg": { const k = b.dataset.k; S.open[k] = !S.open[k]; render(); const n = document.querySelector(`[data-act="tg"][data-k="${k}"]`); if (n) n.focus({ preventScroll: true }); break; }
    case "pay": togglePay(b.dataset.kind, b.dataset.id); break;
    case "tc-estado": { const card = b.dataset.card, cur = S.tcs.find(t => t.mesPago === S.mes && t.tarjeta === card);
      tcDraft[card] = v;
      if (cur && cur.id) saveTc(card, true); else b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      break; }
    case "tc-save": saveTc(b.dataset.card); break;
    case "cfg-save": saveCfg(); break;
    case "exp-scope": S.expScope = v; render(); break;
    case "exp-movs": { const rows = exportRows(); if (!rows.length) { toast("No hay movimientos para exportar."); break; } copyText(rows.map(x => movCols(x).join("\t")).join("\n"), rows.length + " movimientos"); break; }
    case "exp-tcs": { const rows = (S.expScope === "mes" ? S.tcs.filter(t => t.mesPago === S.mes) : S.tcs.slice()).sort((a, b) => a.mesPago.localeCompare(b.mesPago));
      if (!rows.length) { toast("No hay estados de cuenta para exportar."); break; }
      copyText(rows.map(t => [t.mesPago + "-01", t.tarjeta, Number(t.facturado) || "", t.estado || "", t.nota || ""].map(clean).join("\t")).join("\n"), rows.length + " estados de cuenta"); break; }
    case "exp-csv": downloadCsv(); break;
    case "bk-down": backupDown(); break;
    case "bk-restore": { const i = document.getElementById("restore-in"); if (i) i.click(); break; }
    case "bk-cancel": S.pendingImport = null; render(); break;
    case "bk-confirm": if (S.pendingImport) applyBackup(S.pendingImport); break;
    case "ob-empty": startEmpty(); break;
  }
});
document.addEventListener("submit", e => { if (e.target.id === "f") { e.preventDefault(); saveForm(); } });
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "q") { S.q = t.value; const l = $("#mlist"); if (l) l.innerHTML = movList(); return; }
  if (t.id === "imp-txt" && S.form && S.form.imp) { S.form.text = t.value; return; }
  if (t.id === "tc-corte" || t.id === "tc-pago") { t.value = String(digits(t.value) || "").slice(0, 2); return; }
  if (t.id === "f-monto" || t.hasAttribute("data-money")) {
    const n = digits(t.value); t.value = fmtIn(n);
    if (t.id === "f-monto" && S.form) { S.form.monto = n; updLive(); }
  }
});
document.addEventListener("change", e => {
  if (!S.form) return;
  if (e.target.id === "f-fecha") { S.form.fecha = e.target.value || S.form.fecha; readForm(); refreshAuto(); renderSheet(); }
  else if (e.target.id === "f-vence") S.form.vence = e.target.value || "";
  else if (S.form.imp && e.target.matches(".sel[data-i]")) { const r = S.form.rows[Number(e.target.dataset.i)]; if (r) { r.cat = e.target.value; if (r.cat && !r.abono) r.on = true; renderImport(); } }
});
document.addEventListener("focusout", e => { if (e.target.id === "q" && S.pendingRender) setTimeout(() => { if (document.activeElement !== e.target) render(); }, 0); });
const TABS = ["resumen", "movimientos", "tarjeta", "aprende", "ajustes"];
function setHash() { try { history.replaceState(null, "", "#" + S.tab); } catch (e) { /* algunos visores no permiten cambiar la URL */ } }
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && S.form) closeSheet();
  if (e.key === "Enter" && e.target && e.target.id === "pdf-pass") { e.preventDefault(); const b = document.querySelector('[data-act="pdf-pass"]'); if (b) b.click(); }
});

const h = (location.hash || "").replace("#", "");
if (TABS.includes(h)) S.tab = h;
window.addEventListener("hashchange", () => { const k = location.hash.replace("#", ""); if (TABS.includes(k) && k !== S.tab) { S.tab = k; render(); } });
boot();
if ("serviceWorker" in navigator) { window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => { /* sin modo offline */ }); }); }
})();
</script>
</body>
</html>
